# Compila l'APK a ogni push e lo pubblica come release "Versione X.Y.Z" (tag vX.Y.Z, versione e novità da CHANGELOG.md),
# così si scarica e si installa direttamente dal telefono senza Android Studio.
name: APK

on:
  push:
    # Solo main: senza filtro anche il push di un tag (es. build-4) ricompilerebbe codice vecchio
    branches: [main]
    # Le modifiche solo alla documentazione non generano una build nuova (e l'avviso di aggiornamento)
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Prima di compilare: se la versione è già uscita è inutile andare avanti
      - name: Versione
        run: |
          version=$(.github/versione.sh "$RUNNER_TEMP/novita.md")
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Chiave di firma fissa dai secrets KEYSTORE_BASE64 e KEYSTORE_PASSWORD; se mancano si firma con la chiave debug
      - name: Chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/casttokodi.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/casttokodi.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KEYSTORE_BASE64 mancante: APK firmato con la chiave debug, per installarlo va disinstallata la versione precedente"
          fi

      # Il runner ha già l'SDK Android in $ANDROID_HOME
      - run: ./gradlew assembleDebug --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - run: cp app/build/outputs/apk/debug/app-debug.apk CastToKodi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CastToKodi
          path: CastToKodi.apk

      # Un tag per versione (vX.Y.Z) perché Obtainium riconosca le versioni nuove dal tag. Il nome dell'asset resta
      # CastToKodi.apk, così il link releases/latest/download/CastToKodi.apk non cambia.
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true  # vecchio schema a tag fisso
          echo -e "\n---\nBuild ${GITHUB_RUN_NUMBER}, da ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Apri CastToKodi.apk dal telefono per installarla." >> "$RUNNER_TEMP/novita.md"
          gh release create "v${VERSION}" CastToKodi.apk \
            --target "$GITHUB_SHA" \
            --title "Versione ${VERSION}" \
            --notes-file "$RUNNER_TEMP/novita.md" \
            --latest
