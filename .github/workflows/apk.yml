# Compila l'APK a ogni push e lo pubblica come release "Build N" (tag build-N),
# così si scarica e si installa direttamente dal telefono senza Android Studio.
name: APK

on:
  push:
    # Solo main: senza filtro anche il push di un tag (es. build-4) ricompilerebbe codice vecchio
    branches: [main]
    # Le modifiche solo alla documentazione non generano una build nuova (e l'avviso di aggiornamento)
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Chiave di firma fissa dai secrets KEYSTORE_BASE64 e KEYSTORE_PASSWORD; se mancano si firma con la chiave debug
      - name: Chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/casttokodi.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/casttokodi.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KEYSTORE_BASE64 mancante: APK firmato con la chiave debug, per installarlo va disinstallata la versione precedente"
          fi

      # Il runner ha già l'SDK Android in $ANDROID_HOME
      - run: ./gradlew assembleDebug --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - run: cp app/build/outputs/apk/debug/app-debug.apk CastToKodi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CastToKodi
          path: CastToKodi.apk

      # Un tag per build (build-N) perché Obtainium riconosca le versioni nuove dal tag
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true  # vecchio schema a tag fisso
          gh release create "build-${GITHUB_RUN_NUMBER}" CastToKodi.apk \
            --target "$GITHUB_SHA" \
            --title "Build ${GITHUB_RUN_NUMBER}" \
            --notes "Compilata da ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Apri CastToKodi.apk dal telefono per installarla." \
            --latest
