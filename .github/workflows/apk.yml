# Compila l'APK a ogni push e lo pubblica nella release "latest",
# così si scarica e si installa direttamente dal telefono senza Android Studio.
name: APK

on:
  push:
    # Le modifiche solo alla documentazione non generano una build nuova (e l'avviso di aggiornamento)
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Il runner ha già l'SDK Android in $ANDROID_HOME
      - run: ./gradlew assembleDebug --stacktrace

      - run: cp app/build/outputs/apk/debug/app-debug.apk CastToKodi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CastToKodi
          path: CastToKodi.apk

      - name: Pubblica nella release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest CastToKodi.apk \
            --target "$GITHUB_SHA" \
            --title "Build ${GITHUB_RUN_NUMBER}" \
            --notes "Compilata da ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Apri CastToKodi.apk dal telefono per installarla."
