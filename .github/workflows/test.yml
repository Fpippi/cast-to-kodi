# Su ogni PR verso develop (lavoro) i test della logica; verso main (rilascio) anche la compilazione dell'APK. Se fallisce,
# la PR non si può unire (con i ruleset che richiedono il controllo "test", vedi README).
name: Test

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Niente paths-ignore: un controllo obbligatorio che non parte resta "in attesa" e blocca la PR
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Verso develop solo i test, che girano sulla JVM e compilano già il codice: veloci
      - run: ./gradlew testDebugUnitTest --stacktrace

      # Gli script che l'app esegue dentro le pagine dei siti, in un Chromium vero (lo stesso motore del WebView) su
      # pagine finte: app/src/test/js. Usa il Google Chrome già installato su GitHub, quindi niente browser da scaricare
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test degli script nelle pagine
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright-core@1.55.0
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node --test app/src/test/js/*.test.js

      # Verso main (rilascio) anche l'APK completo, che verifica manifest e risorse. Firma con la chiave debug.
      # Qui vanno i controlli più pesanti, quando ce ne saranno. Stesso job "test", così basta un solo check nei ruleset.
      # Verso main anche la versione: una sezione nuova in cima a CHANGELOG.md, con le novità
      - if: github.base_ref == 'main'
        run: .github/versione.sh "$RUNNER_TEMP/novita.md"

      - if: github.base_ref == 'main'
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: risultati-test
          path: app/build/reports/tests/
